---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kumbu-landing-config
data:
  NAME: "vite"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kumbu-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      name: kumbu-landing
  template:
    metadata:
      labels:
        name: kumbu-landing
    spec:
      containers:
        - name: kumbu-landing
          image: $IMAGE_NAME:$IMAGE_VERSION
          envFrom:
            - configMapRef:
                name: kumbu-landing-config
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: kumbu-landing
      nodeSelector:
        workload-type: $APP_LABEL
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: kumbu-landing-backendconfig
spec:
  healthCheck:
    checkIntervalSec: 120
    timeoutSec: 60
    healthyThreshold: 2
    unhealthyThreshold: 3
    port: 3001
    type: HTTP
    requestPath: /

---
# service 
apiVersion: v1
kind: Service
metadata:
  name: kumbu-landing
  annotations:
    beta.cloud.google.com/neg: '{"ingress": true}'
    beta.cloud.google.com/backend-config: '{"default": "kumbu-landing-backendconfig"}'
spec:
  type: NodePort
  selector:
    name: kumbu-landing
  ports:
    - port: 3001
      targetPort: 3001
